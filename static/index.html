<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Control Deck</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;
  --surface:#1e293b;
  --surface2:#334155;
  --accent:#06b6d4;
  --green:#10b981;
  --red:#ef4444;
  --text:#e2e8f0;
  --text-dim:#94a3b8;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
html,body{
  height:100%;width:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter','Segoe UI','Roboto',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
body{display:flex;align-items:center;justify-content:center;padding:12px}
#app{
  width:100%;max-width:1280px;height:100%;
  display:flex;flex-direction:column;gap:12px;
}

.card{
  background:var(--surface);
  border-radius:var(--radius);
  padding:16px 20px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,0.04);
}

.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── Section A: Now Playing & Timeline ── */
#now-playing-card{display:flex;flex-direction:column;gap:14px}
#now-playing-main{display:flex;align-items:center;gap:18px}
#album-art-wrap{
  flex-shrink:0;width:80px;height:80px;
  border-radius:12px;overflow:hidden;
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
#album-art{width:100%;height:100%;object-fit:cover;display:block}
#album-art.fallback{display:none}
.fallback-icon{font-size:32px;color:var(--text-dim);line-height:1}
#track-info{flex:1;min-width:0}
#track-title{font-size:1.2rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
#track-artist{font-size:0.9rem;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status-badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:6px;font-size:0.75rem;padding:3px 10px;
  border-radius:20px;background:rgba(16,185,129,0.15);
  color:var(--green);border:1px solid rgba(16,185,129,0.25);
  width:fit-content;
}
#status-badge.idle{background:rgba(148,163,184,0.12);color:var(--text-dim);border-color:rgba(148,163,184,0.2)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
#status-badge.idle .status-dot{background:var(--text-dim)}

#media-actions{display:flex;gap:8px;flex-shrink:0}
.media-btn{
  width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.08);
  background:var(--surface2);
  color:var(--text);
  font-size:1.2rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.12s ease;
  -webkit-tap-highlight-color:transparent;
}
.media-btn:active{transform:scale(0.9);background:var(--accent);border-color:var(--accent)}

/* Timeline Bar Styling */
#timeline-container{display:flex;flex-direction:column;gap:6px;width:100%}
.timeline-time-wrap{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-dim);font-weight:600}
#timeline-slider{
  width:100%;height:6px;-webkit-appearance:none;appearance:none;
  background:var(--surface2);border-radius:6px;outline:none;cursor:pointer;
}
#timeline-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--accent);cursor:pointer;
  box-shadow:0 0 10px rgba(6,182,212,0.5);
}

/* ── Section B: Steppers ── */
.stepper-card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:18px 12px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid rgba(255,255,255,0.04);
}
.stepper-label{font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);font-weight:600}
.stepper-row{display:flex;gap:10px;width:100%;justify-content:center}
.stepper-btn{
  flex:1;max-width:100px;padding:10px 0;border-radius:var(--radius-sm);
  border:1px solid rgba(255,255,255,0.08);background:var(--surface2);
  color:var(--text);font-size:0.95rem;font-weight:600;
  cursor:pointer;transition:all 0.1s ease;text-align:center;
  -webkit-tap-highlight-color:transparent;
}
.stepper-btn:active{transform:scale(0.93);background:var(--accent);border-color:var(--accent);color:#fff}
.stepper-btn.mute{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.2);color:var(--red)}
.stepper-btn.mute:active{background:var(--red);color:#fff;border-color:var(--red)}

/* ── Section C: Toggles ── */
.toggle-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:22px 12px;border-radius:var(--radius);
  background:var(--surface);border:1px solid rgba(255,255,255,0.04);
  cursor:pointer;transition:all 0.15s ease;-webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden;
}
.toggle-card .icon{font-size:1.8rem;line-height:1}
.toggle-card .label{font-size:0.82rem;font-weight:600;color:var(--text-dim);text-align:center}
.toggle-card:active{transform:scale(0.95)}
.toggle-card.on{
  border-color:var(--accent);
  box-shadow:0 0 20px rgba(6,182,212,0.15),inset 0 0 40px rgba(6,182,212,0.05);
}
.toggle-card.on .label{color:var(--accent)}

.ripple{position:absolute;border-radius:50%;background:rgba(6,182,212,0.25);transform:scale(0);animation:rippleAnim 0.5s ease-out;pointer-events:none}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

#kde-frame-container {position:absolute;width:0;height:0;border:0;visibility:hidden;overflow:hidden;pointer-events:none}

@media(max-width:720px){
  .grid-3{grid-template-columns:1fr 1fr}
  #now-playing-main{flex-wrap:wrap}
  #media-actions{margin-left:auto}
}
@media(max-width:480px){
  .grid-3{grid-template-columns:1fr 1fr}
  #now-playing-main{gap:12px}
  #album-art-wrap{width:64px;height:64px}
  .fallback-icon{font-size:26px}
  #track-title{font-size:1.05rem}
  .stepper-btn{max-width:80px;padding:8px 0;font-size:0.85rem}
}
</style>
</head>
<body>

<div id="kde-frame-container">
  <iframe id="kde-runner" name="kde-runner" style="display:none;"></iframe>
</div>

<div id="app">

  <!-- ── Now Playing & Timeline Card ── -->
  <div class="card" id="now-playing-card">
    <div id="now-playing-main">
      <div id="album-art-wrap">
        <img id="album-art" src="" alt="">
        <span class="fallback-icon" id="fallback-icon">&#x266B;</span>
      </div>
      <div id="track-info">
        <div id="track-title">No Track</div>
        <div id="track-artist">Waiting for playback...</div>
        <div id="status-badge" class="idle"><span class="status-dot"></span> Disconnected</div>
      </div>
      <div id="media-actions">
        <button class="media-btn" data-cmd="previous" title="Previous">&#x23EE;</button>
        <button class="media-btn" data-cmd="playpause" title="Play / Pause">&#x23EF;</button>
        <button class="media-btn" data-cmd="next" title="Next">&#x23ED;</button>
      </div>
    </div>

    <!-- Timeline Slider -->
    <div id="timeline-container">
      <input type="range" id="timeline-slider" min="0" max="100" value="0">
      <div class="timeline-time-wrap">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>
  </div>

  <!-- ── Steppers Grid ── -->
  <div class="grid-3">
    <div class="stepper-card">
      <div class="stepper-label">Volume</div>
      <div class="stepper-row">
        <button class="stepper-btn" data-cmd="volDown">&#x1F509; -5%</button>
        <button class="stepper-btn" data-cmd="volUp">&#x1F50A; +5%</button>
      </div>
    </div>
    <div class="stepper-card">
      <div class="stepper-label">Audio</div>
      <div class="stepper-row">
        <button class="stepper-btn mute" data-cmd="mute">&#x1F507; Mute</button>
      </div>
    </div>
    <div class="stepper-card">
      <div class="stepper-label">Brightness</div>
      <div class="stepper-row">
        <button class="stepper-btn" data-cmd="brightnessDown">&#x1F505; -10%</button>
        <button class="stepper-btn" data-cmd="brightnessUp">&#x1F506; +10%</button>
      </div>
    </div>
  </div>

  <!-- ── Toggles Grid ── -->
  <div class="grid-3">
    <div class="toggle-card" data-cmd="caffeine">
      <span class="icon">&#x2615;</span>
      <span class="label">Caffeine<br>Keep Awake</span>
    </div>
    <div class="toggle-card" data-cmd="bluetooth">
      <span class="icon">&#x1F5B2;</span>
      <span class="label">Bluetooth<br>Toggle</span>
    </div>
    <div class="toggle-card" data-cmd="lock">
      <span class="icon">&#x1F512;</span>
      <span class="label">Lock<br>Desktop</span>
    </div>
    <div class="toggle-card" id="erp-btn">
      <span class="icon">&#x1F393;</span>
      <span class="label">ERP<br>Login</span>
    </div>
    <div class="toggle-card" id="warp-btn">
      <span class="icon">&#x1F6E1;</span>
      <span class="label" id="warp-label">WARP<br>OFF</span>
    </div>
  </div>

</div>

<script>
const CONFIG = {
  deviceId: '6101788931424e7096ed6ff08e9a1cd6',
  commands: {
    previous:       'cd270337-b3b3-4cad-ba76-b09dd204c63b',
    playpause:      '3f7258b7-41b1-4515-a70b-445416eac41c',
    next:           '58b4829d-6107-4ead-9c6e-c6eb6d6d6d79',
    volUp:          '87943c88-4505-4d90-b67e-e999940e3af2',
    volDown:        '92c0072a-711d-49a8-9302-3531d8618ed5',
    mute:           'f31f8711-695f-4dd5-8e3c-e6a9ca70d157',
    brightnessUp:   '8142fe27-4f11-47f8-9987-a650044c3687',
    brightnessDown: 'bec3cbfc-1f7a-4877-a9bf-3282329fc268',
    caffeine:       '774d4822-6643-4bfa-a132-85b006c0aa4a',
    bluetooth:      '0c9b834e-96cc-46ac-b6b5-af1b395090ed',
    lock:           'lock',
    erpLogin:       '34edfbd5-fa81-4578-8040-9ef5c59df35b',
    warpOn:         '814a1288-485b-4b4a-8f74-8c99ad49af0d',
    warpOff:        '08262f4e-d247-4767-862d-a2fd28d8d468',
  }
};

function triggerKdeCommand(commandKey) {
  const cmdId = CONFIG.commands[commandKey];
  if (!cmdId) return;
  const uri = `kdeconnect://runcommand/${CONFIG.deviceId}/${cmdId}`;
  const runner = document.getElementById('kde-runner');
  if (runner) runner.src = uri;
}

function createRipple(e, el) {
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.2;
  const touch = e.touches ? e.touches[0] : e;
  const x = touch.clientX - rect.left - size / 2;
  const y = touch.clientY - rect.top - size / 2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  el.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

// Media UI Elements
const albumArt = document.getElementById('album-art');
const fallbackIcon = document.getElementById('fallback-icon');
const trackTitle = document.getElementById('track-title');
const trackArtist = document.getElementById('track-artist');
const statusBadge = document.getElementById('status-badge');
const timelineSlider = document.getElementById('timeline-slider');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');

let isUserDraggingSlider = false;

function formatTime(seconds) {
  if (isNaN(seconds) || seconds <= 0) return '0:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

function renderMediaState(data) {
  if (!data || !data.title) {
    albumArt.src = '';
    albumArt.style.display = 'none';
    fallbackIcon.style.display = 'block';
    trackTitle.textContent = 'No Track';
    trackArtist.textContent = 'Idle / Disconnected';
    statusBadge.className = 'idle';
    statusBadge.innerHTML = '<span class="status-dot"></span> Disconnected';
    timeCurrent.textContent = '0:00';
    timeTotal.textContent = '0:00';
    timelineSlider.value = 0;
    return;
  }

  trackTitle.textContent = data.title;
  trackArtist.textContent = data.artist || 'Unknown Artist';
  statusBadge.className = '';
  statusBadge.innerHTML = `<span class="status-dot"></span> ${data.status || 'Playing'}`;

  // Album Art handling
  if (data.art_url) {
    if (albumArt.getAttribute('data-raw-src') !== data.art_url) {
      albumArt.setAttribute('data-raw-src', data.art_url);
      albumArt.src = data.art_url;
    }
    albumArt.style.display = 'block';
    fallbackIcon.style.display = 'none';
  } else {
    albumArt.src = '';
    albumArt.style.display = 'none';
    fallbackIcon.style.display = 'block';
  }

  // Timeline position & track duration updates
  if (!isUserDraggingSlider && data.length > 0) {
    timelineSlider.max = Math.floor(data.length);
    timelineSlider.value = Math.floor(data.position);
    timeCurrent.textContent = formatTime(data.position);
    timeTotal.textContent = formatTime(data.length);
  }
}

// Fallback if album art image URL fails to resolve/load
albumArt.addEventListener('error', () => {
  albumArt.style.display = 'none';
  fallbackIcon.style.display = 'block';
});

// SSE Stream Connection
function initMediaStream() {
  const evtSource = new EventSource('/media-stream');

  evtSource.onmessage = function(e) {
    try {
      const data = JSON.parse(e.data);
      renderMediaState(data);
    } catch (err) {
      console.error("Failed to parse SSE media state:", err);
    }
  };

  evtSource.onerror = function() {
    renderMediaState(null);
  };
}

// Handle Seeking on Timeline
timelineSlider.addEventListener('input', () => {
  isUserDraggingSlider = true;
  timeCurrent.textContent = formatTime(timelineSlider.value);
});

timelineSlider.addEventListener('change', () => {
  const targetSeconds = parseFloat(timelineSlider.value);
  fetch('/seek', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ position: targetSeconds })
  }).then(() => {
    isUserDraggingSlider = false;
  }).catch(() => {
    isUserDraggingSlider = false;
  });
});

// Controls & Buttons Event Listeners
document.querySelectorAll('.media-btn, .stepper-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    createRipple(e, btn);
    triggerKdeCommand(btn.dataset.cmd);
  });
});

document.querySelectorAll('.toggle-card[data-cmd]').forEach(card => {
  card.addEventListener('click', e => {
    createRipple(e, card);
    triggerKdeCommand(card.dataset.cmd);
    card.classList.toggle('on');
  });
});

// ERP & WARP Special Handlers
const erpBtn = document.getElementById('erp-btn');
if (erpBtn) {
  erpBtn.addEventListener('click', e => {
    createRipple(e, erpBtn);
    triggerKdeCommand('erpLogin');
  });
}

let isWarpActive = false;
const warpBtn = document.getElementById('warp-btn');
const warpLabel = document.getElementById('warp-label');
if (warpBtn) {
  warpBtn.addEventListener('click', e => {
    createRipple(e, warpBtn);
    if (isWarpActive) {
      triggerKdeCommand('warpOff');
      warpBtn.classList.remove('on');
      warpLabel.innerHTML = 'WARP<br>OFF';
      isWarpActive = false;
    } else {
      triggerKdeCommand('warpOn');
      warpBtn.classList.add('on');
      warpLabel.innerHTML = 'WARP<br>ON';
      isWarpActive = true;
    }
  });
}

// Start SSE stream
initMediaStream();
</script>
</body>
</html>
