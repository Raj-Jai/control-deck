    <title>Control Deck</title>
    <script>
      // Applied before first paint, or the page flashes the dark theme on a
      // light-theme device while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('dash_theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/static/assets/index-DzNjvOIa.js"></script>

    </script>
