<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Control Deck</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;
  --surface:#1e293b;
  --surface2:#334155;
  --accent:#06b6d4;
  --green:#10b981;
  --red:#ef4444;
  --text:#e2e8f0;
  --text-dim:#94a3b8;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
html,body{
  height:100%;width:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
}
body{display:flex;align-items:center;justify-content:center;padding:12px}
#app{
  width:100%;max-width:1280px;height:100%;
  display:flex;flex-direction:column;gap:12px;
}

.card{
  background:var(--surface);
  border-radius:var(--radius);
  padding:16px 20px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,0.04);
}

.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Now Playing Section */
#now-playing-card{display:flex;flex-direction:column;gap:14px}
#now-playing-main{display:flex;align-items:center;gap:18px}
#album-art-wrap{
  flex-shrink:0;width:80px;height:80px;
  border-radius:12px;overflow:hidden;
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
#album-art{width:100%;height:100%;object-fit:cover;display:block}
.fallback-icon{font-size:32px;color:var(--text-dim);line-height:1}
#track-info{flex:1;min-width:0}
#track-title{font-size:1.2rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#track-artist{font-size:0.9rem;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status-badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:6px;font-size:0.75rem;padding:3px 10px;
  border-radius:20px;background:rgba(16,185,129,0.15);
  color:var(--green);border:1px solid rgba(16,185,129,0.25);
  width:fit-content;
}
#status-badge.idle{background:rgba(148,163,184,0.12);color:var(--text-dim);border-color:rgba(148,163,184,0.2)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
#status-badge.idle .status-dot{background:var(--text-dim)}

#media-actions{display:flex;gap:8px;flex-shrink:0}
.media-btn{
  width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.08);
  background:var(--surface2);
  color:var(--text);
  font-size:1.2rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.12s ease;
}
.media-btn:active{transform:scale(0.9);background:var(--accent)}

/* Timeline Bar Styling */
#timeline-container{display:flex;flex-direction:column;gap:6px;width:100%}
.timeline-time-wrap{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-dim);font-weight:600}
#timeline-slider{
  width:100%;height:6px;-webkit-appearance:none;appearance:none;
  background:var(--surface2);border-radius:6px;outline:none;cursor:pointer;
}
#timeline-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--accent);cursor:pointer;
  box-shadow:0 0 10px rgba(6,182,212,0.5);
}

/* Steppers Section */
.stepper-card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:18px 12px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid rgba(255,255,255,0.04);
}
.stepper-label{font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);font-weight:600}
.stepper-row{display:flex;gap:10px;width:100%;justify-content:center}
.stepper-btn{
  flex:1;max-width:100px;padding:10px 0;border-radius:var(--radius-sm);
  border:1px solid rgba(255,255,255,0.08);background:var(--surface2);
  color:var(--text);font-size:0.95rem;font-weight:600;
  cursor:pointer;transition:all 0.1s ease;text-align:center;
}
.stepper-btn:active{transform:scale(0.93);background:var(--accent);color:#fff}
.stepper-btn.mute{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.2);color:var(--red)}
.stepper-btn.mute:active{background:var(--red);color:#fff}

/* Volume Slider */
.volume-row{display:flex;align-items:center;gap:10px;width:100%}
#volume-slider,#brightness-slider{flex:1;height:6px;-webkit-appearance:none;appearance:none;background:var(--surface2);border-radius:6px;outline:none;cursor:pointer}
#volume-slider::-webkit-slider-thumb,#brightness-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(6,182,212,0.4)}
#volume-pct,#brightness-pct{font-size:0.9rem;font-weight:700;color:var(--text);min-width:40px;text-align:right}
.vol-mute-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,0.08);background:var(--surface2);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.1s ease}
.vol-mute-btn:active{transform:scale(0.9);background:var(--accent)}
.vol-mute-btn.muted{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.2);color:var(--red)}
#night-btn.on{background:rgba(6,182,212,0.15);border-color:rgba(6,182,212,0.3);color:var(--accent);box-shadow:0 0 12px rgba(6,182,212,0.25)}

/* Toggles Section */
.toggle-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:22px 12px;border-radius:var(--radius);
  background:var(--surface);border:1px solid rgba(255,255,255,0.04);
  cursor:pointer;transition:all 0.15s ease;position:relative;overflow:hidden;
}
.toggle-card .icon{font-size:1.8rem;line-height:1}
.toggle-card .label{font-size:0.82rem;font-weight:600;color:var(--text-dim);text-align:center}
.toggle-card:active{transform:scale(0.95)}
.toggle-card.on{
  border-color:var(--accent);
  box-shadow:0 0 20px rgba(6,182,212,0.15),inset 0 0 40px rgba(6,182,212,0.05);
}
.toggle-card.on .label{color:var(--accent)}
.bt-connect{
  position:absolute;bottom:4px;right:4px;
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.08);
  background:var(--surface2);color:var(--text-dim);
  font-size:0.75rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.1s ease;z-index:2;
}
.bt-connect:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.bt-connect:active{transform:scale(0.85)}

/* System Stats */
#sys-card{display:flex;flex-direction:column;gap:10px}
.sys-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.sys-item{text-align:center}
.sys-label{font-size:0.7rem;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:4px}
.sys-bar-bg{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sys-bar{height:100%;border-radius:4px;transition:width 0.3s ease}
.sys-bar.cpu{background:var(--accent)}
.sys-bar.ram{background:#8b5cf6}
.sys-bar.bat{background:#10b981}
.sys-bar.temp{background:#f59e0b}
.sys-value{font-size:0.85rem;font-weight:700;margin-top:4px;color:var(--text)}
.sys-network{margin-top:6px;font-size:0.78rem;color:var(--text-dim);text-align:center;display:flex;justify-content:center;gap:14px}
.sys-network .ping-ok{color:#10b981}
.sys-network .ping-fail{color:#ef4444}

.ripple{position:absolute;border-radius:50%;background:rgba(6,182,212,0.25);transform:scale(0);animation:rippleAnim 0.5s ease-out;pointer-events:none}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

@media(max-width:720px){.grid-3{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
@media(max-width:480px){
  #album-art-wrap{width:64px;height:64px}
  .stepper-btn{max-width:80px;padding:8px 0;font-size:0.85rem}
}
</style>
</head>
<body>

<div id="app">

  <!-- Now Playing Card -->
  <div class="card" id="now-playing-card">
    <div id="now-playing-main">
      <div id="album-art-wrap">
        <img id="album-art" src="" alt="">
        <span class="fallback-icon" id="fallback-icon">&#x266B;</span>
      </div>
      <div id="track-info">
        <div id="track-title">No Track</div>
        <div id="track-artist">Waiting for playback...</div>
        <div id="status-badge" class="idle"><span class="status-dot"></span> Offline</div>
      </div>
      <div id="media-actions">
        <button class="media-btn" data-cmd="previous" title="Previous">&#x23EE;</button>
        <button class="media-btn" data-cmd="playpause" title="Play / Pause">&#x23EF;</button>
        <button class="media-btn" data-cmd="next" title="Next">&#x23ED;</button>
      </div>
    </div>

    <div id="timeline-container">
      <input type="range" id="timeline-slider" min="0" max="100" value="0">
      <div class="timeline-time-wrap">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>
  </div>

  <!-- Controls Grid -->
  <div class="grid-2">
    <div class="stepper-card" id="volume-card">
      <div class="stepper-label">Volume</div>
      <div class="volume-row">
        <button class="vol-mute-btn" id="vol-mute-btn">&#x1F50A;</button>
        <input type="range" id="volume-slider" min="0" max="100" value="100">
        <span id="volume-pct">100%</span>
      </div>
    </div>
    <div class="stepper-card">
      <div class="stepper-label">Brightness</div>
      <div class="volume-row">
        <button class="vol-mute-btn" id="night-btn">&#x1F319;</button>
        <input type="range" id="brightness-slider" min="0" max="100" value="100">
        <span id="brightness-pct">100%</span>
      </div>
    </div>
  </div>

  <!-- Toggles Grid -->
  <div class="grid-3">
    <div class="toggle-card" id="bt-btn">
      <span class="icon">&#x1F5B2;</span>
      <span class="label" id="bt-label">Bluetooth<br>OFF</span>
      <button class="bt-connect" id="bt-connect-btn" title="Connect headphone">&#x1F50A;</button>
    </div>
    <div class="toggle-card" data-cmd="lock">
      <span class="icon">&#x1F512;</span>
      <span class="label">Lock<br>Desktop</span>
    </div>
    <div class="toggle-card" data-cmd="erpLogin">
      <span class="icon">&#x1F393;</span>
      <span class="label">ERP<br>Login</span>
    </div>
    <div class="toggle-card" id="warp-btn">
      <span class="icon">&#x1F6E1;</span>
      <span class="label" id="warp-label">WARP<br>OFF</span>
    </div>
  </div>

  <!-- System Stats Card -->
  <div class="card" id="sys-card">
    <div class="sys-grid">
      <div class="sys-item">
        <div class="sys-label">CPU</div>
        <div class="sys-bar-bg"><div class="sys-bar cpu" id="cpu-bar" style="width:0%"></div></div>
        <div class="sys-value" id="cpu-val">--</div>
      </div>
      <div class="sys-item">
        <div class="sys-label">RAM</div>
        <div class="sys-bar-bg"><div class="sys-bar ram" id="ram-bar" style="width:0%"></div></div>
        <div class="sys-value" id="ram-val">--</div>
      </div>
      <div class="sys-item">
        <div class="sys-label">BAT</div>
        <div class="sys-bar-bg"><div class="sys-bar bat" id="bat-bar" style="width:0%"></div></div>
        <div class="sys-value" id="bat-val">--</div>
      </div>
      <div class="sys-item">
        <div class="sys-label">TEMP</div>
        <div class="sys-bar-bg"><div class="sys-bar temp" id="temp-bar" style="width:0%"></div></div>
        <div class="sys-value" id="temp-val">--</div>
      </div>
    </div>
    <div class="sys-network" id="sys-network">Network: --</div>
  </div>

</div>

<script>
function triggerCommand(cmdKey) {
  fetch('/api/command', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command: cmdKey })
  }).catch(err => console.error('Command failed:', err));
}

function createRipple(e, el) {
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.2;
  const touch = e.touches ? e.touches[0] : e;
  const x = touch.clientX - rect.left - size / 2;
  const y = touch.clientY - rect.top - size / 2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  el.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

// Media UI Elements
const albumArt = document.getElementById('album-art');
const fallbackIcon = document.getElementById('fallback-icon');
const trackTitle = document.getElementById('track-title');
const trackArtist = document.getElementById('track-artist');
const statusBadge = document.getElementById('status-badge');
const timelineSlider = document.getElementById('timeline-slider');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');

let isUserDraggingSlider = false;
let currentArtUrl = null;
let artLoaded = false;

function formatTime(seconds) {
  if (isNaN(seconds) || seconds <= 0) return '0:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

function updateArtDisplay(url) {
  if (!url) {
    currentArtUrl = null;
    artLoaded = false;
    albumArt.style.display = 'none';
    fallbackIcon.style.display = 'block';
    return;
  }
  if (url !== currentArtUrl) {
    currentArtUrl = url;
    artLoaded = false;
    albumArt.src = url;
    albumArt.style.display = 'block';
    fallbackIcon.style.display = 'none';
  } else if (artLoaded) {
    albumArt.style.display = 'block';
    fallbackIcon.style.display = 'none';
  }
}

function renderMediaState(data) {
  if (!data || !data.title) {
    albumArt.src = '';
    albumArt.style.display = 'none';
    fallbackIcon.style.display = 'block';
    currentArtUrl = null;
    artLoaded = false;
    trackTitle.textContent = 'No Track';
    trackArtist.textContent = 'Idle / Disconnected';
    statusBadge.className = 'idle';
    statusBadge.innerHTML = '<span class="status-dot"></span> Offline';
    timeCurrent.textContent = '0:00';
    timeTotal.textContent = '0:00';
    timelineSlider.value = 0;
    return;
  }

  trackTitle.textContent = data.title;
  trackArtist.textContent = data.artist || 'Unknown Artist';
  statusBadge.className = '';
  statusBadge.innerHTML = `<span class="status-dot"></span> ${data.status || 'Playing'}`;

  updateArtDisplay(data.art_url);

  if (!isUserDraggingSlider) {
    timelineSlider.value = Math.floor(data.position);
    timeCurrent.textContent = formatTime(data.position);
    if (data.length > 0) {
      timelineSlider.max = Math.floor(data.length);
      timeTotal.textContent = formatTime(data.length);
    } else {
      timeTotal.textContent = '--:--';
    }
  }

  if (data.volume >= 0) {
    const pct = Math.round(data.volume * 100);
    if (!isUserDraggingVolume) {
      volumeSlider.value = Math.min(pct, 100);
      volumePct.textContent = Math.min(pct, 100) + '%';
    }
    volMuteBtn.classList.toggle('muted', data.muted);
    volMuteBtn.innerHTML = data.muted ? '&#x1F507;' : '&#x1F50A;';
  }

  if (data.brightness >= 0) {
    const val = Math.round(data.brightness);
    if (!isUserDraggingBrightness) {
      brightnessSlider.value = Math.min(val, 100);
      brightnessPct.textContent = Math.min(val, 100) + '%';
    }
  }

  nightBtn.classList.toggle('on', data.night_light);

  btBtn.classList.toggle('on', data.bluetooth_on);
  btLabel.innerHTML = data.bluetooth_on ? 'Bluetooth<br>ON' : 'Bluetooth<br>OFF';

  warpBtn.classList.toggle('on', data.warp_on);
  warpLabel.innerHTML = data.warp_on ? 'WARP<br>ON' : 'WARP<br>OFF';

  if (data.sys) {
    const s = data.sys;
    setBar('cpu', s.cpu, s.cpu >= 0 ? Math.round(s.cpu) + '%' : '--');
    setBar('ram', s.ram, s.ram >= 0 ? Math.round(s.ram) + '%' : '--');
    setBar('bat', s.battery, s.battery >= 0 ? Math.round(s.battery) + '%' + (s.charging ? ' \u26A1' : '') : '--');
    const tempStr = s.temp >= 0 ? Math.round(s.temp) + '\u00B0C' : '--';
    setBar('temp', s.temp >= 0 ? Math.min(100, s.temp) : 0, tempStr);

    const pingHTML = s.ping_ok ? '<span class="ping-ok">\u2713</span>' : '<span class="ping-fail">\u2717</span>';
    const parts = [];
    if (s.ssid) parts.push('\u{1F3E0}' + s.ssid);
    if (s.ip) parts.push(s.ip);
    parts.push('Ping ' + pingHTML);
    document.getElementById('sys-network').textContent = parts.join(' \u00B7 ');
  }
}

function setBar(id, pct, label) {
  document.getElementById(id + '-bar').style.width = Math.max(0, Math.min(100, pct)) + '%';
  document.getElementById(id + '-val').textContent = label;
}

albumArt.addEventListener('load', () => {
  artLoaded = true;
  albumArt.style.display = 'block';
  fallbackIcon.style.display = 'none';
});

albumArt.addEventListener('error', () => {
  artLoaded = false;
  albumArt.style.display = 'none';
  fallbackIcon.style.display = 'block';
});

// Stream SSE updates from backend
function initMediaStream() {
  const evtSource = new EventSource('/media-stream');
  evtSource.onmessage = (e) => {
    try {
      renderMediaState(JSON.parse(e.data));
    } catch (err) {
      console.error(err);
    }
  };
  evtSource.onerror = () => renderMediaState(null);
}

// Timeline seeking handlers
timelineSlider.addEventListener('input', () => {
  isUserDraggingSlider = true;
  timeCurrent.textContent = formatTime(timelineSlider.value);
});

timelineSlider.addEventListener('change', () => {
  const targetSeconds = parseFloat(timelineSlider.value);
  fetch('/seek', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ position: targetSeconds })
  }).finally(() => {
    isUserDraggingSlider = false;
  });
});

// Volume slider
const volumeSlider = document.getElementById('volume-slider');
const volumePct = document.getElementById('volume-pct');
const volMuteBtn = document.getElementById('vol-mute-btn');
let isUserDraggingVolume = false;

volumeSlider.addEventListener('input', () => {
  isUserDraggingVolume = true;
  volumePct.textContent = volumeSlider.value + '%';
});

volumeSlider.addEventListener('change', () => {
  const vol = parseInt(volumeSlider.value) / 100;
  fetch('/api/set-volume', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ volume: vol })
  }).finally(() => {
    isUserDraggingVolume = false;
  });
});

volMuteBtn.addEventListener('click', e => {
  createRipple(e, volMuteBtn);
  triggerCommand('mute');
});

// Brightness slider
const brightnessSlider = document.getElementById('brightness-slider');
const brightnessPct = document.getElementById('brightness-pct');
let isUserDraggingBrightness = false;

brightnessSlider.addEventListener('input', () => {
  isUserDraggingBrightness = true;
  brightnessPct.textContent = brightnessSlider.value + '%';
});

brightnessSlider.addEventListener('change', () => {
  const val = parseInt(brightnessSlider.value);
  fetch('/api/set-brightness', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ brightness: val })
  }).finally(() => {
    isUserDraggingBrightness = false;
  });
});

// Event Listeners for Buttons
document.querySelectorAll('.media-btn, .stepper-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    createRipple(e, btn);
    triggerCommand(btn.dataset.cmd);
  });
});

document.querySelectorAll('.toggle-card[data-cmd]').forEach(card => {
  card.addEventListener('click', e => {
    createRipple(e, card);
    triggerCommand(card.dataset.cmd);
    card.classList.toggle('on');
  });
});

const warpBtn = document.getElementById('warp-btn');
const warpLabel = document.getElementById('warp-label');
if (warpBtn) {
  warpBtn.addEventListener('click', e => {
    createRipple(e, warpBtn);
    triggerCommand(warpBtn.classList.contains('on') ? 'warpOff' : 'warpOn');
  });
}

// Night Light toggle (SSE-driven, no local state)
const nightBtn = document.getElementById('night-btn');
if (nightBtn) {
  nightBtn.addEventListener('click', e => {
    createRipple(e, nightBtn);
    triggerCommand(nightBtn.classList.contains('on') ? 'nightOff' : 'nightOn');
  });
}

// Bluetooth toggle (SSE-driven, no local state)
const btBtn = document.getElementById('bt-btn');
const btLabel = document.getElementById('bt-label');
if (btBtn) {
  btBtn.addEventListener('click', e => {
    if (e.target.closest('.bt-connect')) return;
    createRipple(e, btBtn);
    triggerCommand(btBtn.classList.contains('on') ? 'bluetoothOff' : 'bluetoothOn');
  });
}

// Bluetooth connect button
const btConnectBtn = document.getElementById('bt-connect-btn');
if (btConnectBtn) {
  btConnectBtn.addEventListener('click', e => {
    e.stopPropagation();
    triggerCommand('btConnect');
  });
}

initMediaStream();
</script>
</body>
</html>
