<?xml version="1.0" standalone="no"?>
<!DOCTYPE service-group SYSTEM "avahi-service.dtd">
<service-group>
  <!--
    Without an explicit host-name, Avahi advertises the machine's hostname, so
    the dashboard was discoverable as whatever the box is called rather than as
    control-deck.local as the README claimed (BUG-054).

    host-name must resolve. Add this once:
      echo "127.0.0.1 control-deck.local" | sudo tee -a /etc/hosts
  -->
  <name>Control Deck</name>
  <host-name>control-deck.local</host-name>
  <service>
    <type>_http._tcp</type>
    <port>8080</port>
  </service>
  <service>
    <type>_https._tcp</type>
    <port>8443</port>
  </service>
</service-group>
